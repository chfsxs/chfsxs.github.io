<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#6d5dfc">
<title>欢迎李赟</title>
<style>
*{box-sizing:border-box}
html,body{width:100%;height:100%;margin:0}
body{
  overflow:hidden;
  display:grid;
  place-items:center;
  font-family:"Microsoft YaHei","PingFang SC",Arial,sans-serif;
  color:#fff;
  background:
    radial-gradient(circle at 20% 20%,rgba(255,255,255,.20),transparent 28%),
    radial-gradient(circle at 80% 75%,rgba(139,92,246,.38),transparent 32%),
    linear-gradient(135deg,#4f46e5 0%,#7c3aed 48%,#c026d3 100%);
}
.background{position:fixed;inset:0;overflow:hidden;pointer-events:none}
.orb{
  position:absolute;border-radius:50%;filter:blur(3px);
  background:rgba(255,255,255,.10);
  animation:float 10s ease-in-out infinite;
}
.o1{width:240px;height:240px;left:-70px;top:8%}
.o2{width:340px;height:340px;right:-110px;bottom:-80px;animation-delay:-3s}
.o3{width:120px;height:120px;right:20%;top:12%;animation-delay:-6s}
.card{
  position:relative;
  width:min(88vw,780px);
  padding:68px 42px 58px;
  text-align:center;
  border:1px solid rgba(255,255,255,.30);
  border-radius:32px;
  background:rgba(255,255,255,.13);
  box-shadow:0 30px 90px rgba(18,10,55,.35),inset 0 1px rgba(255,255,255,.20);
  backdrop-filter:blur(20px);
  -webkit-backdrop-filter:blur(20px);
  animation:enter .9s cubic-bezier(.2,.8,.2,1) both;
}
.emoji{
  display:inline-grid;place-items:center;
  width:94px;height:94px;margin-bottom:22px;
  border-radius:28px;
  font-size:56px;
  background:rgba(255,255,255,.13);
  box-shadow:inset 0 1px rgba(255,255,255,.25),0 12px 35px rgba(0,0,0,.15);
  animation:bounce 3s ease-in-out infinite;
}
h1{
  margin:0;
  font-size:clamp(46px,9vw,86px);
  line-height:1.08;
  letter-spacing:6px;
  text-shadow:0 6px 28px rgba(0,0,0,.18);
}
p{margin:22px 0 0;font-size:clamp(20px,3vw,27px);opacity:.96}
.sub{margin-top:16px;font-size:15px;letter-spacing:2px;opacity:.70}
.line{
  width:70px;height:4px;margin:26px auto 0;
  border-radius:99px;background:rgba(255,255,255,.72);
}
.hint{margin-top:28px;font-size:13px;opacity:.52}
@keyframes enter{from{opacity:0;transform:translateY(28px) scale(.96)}to{opacity:1;transform:none}}
@keyframes float{50%{transform:translate(25px,-35px) scale(1.08)}}
@keyframes bounce{50%{transform:translateY(-7px) rotate(2deg)}}
@media(max-width:520px){
  .card{padding:52px 22px 44px;border-radius:26px}
  .emoji{width:78px;height:78px;font-size:45px}
  h1{letter-spacing:3px}
}
</style>
</head>
<body>
<div class="background" aria-hidden="true">
  <div class="orb o1"></div><div class="orb o2"></div><div class="orb o3"></div>
</div>

<main class="card">
  <div class="emoji">🎉</div>
  <h1>欢迎李赟</h1>
  <div class="line"></div>
  <p>很高兴见到你！</p>
  <div class="sub">WELCOME, 李赟 · 2026</div>
  <div class="hint">愿新的旅程充满惊喜 ✨</div>
</main>
</body>
</html>
